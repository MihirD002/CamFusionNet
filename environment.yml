# FAPNet reproduction environment (conda)
# Create with:  conda env create -f environment.yml
# Activate with: conda activate fapnet
#
# Notes:
# - pytorch-cuda version must match your installed NVIDIA driver.
#   Check compatibility with `nvidia-smi` (look at "CUDA Version" in the header)
#   before creating the env. 11.7 is a safe modern default as of 2022-2023-era code.
# - If you're on a machine without an NVIDIA GPU (e.g. Apple Silicon, CPU-only),
#   drop the pytorch-cuda line and expect training to be extremely slow;
#   this codebase assumes CUDA (.cuda() calls are hardcoded throughout train.py/test.py).

name: fapnet
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pytorch=1.13.1
  - torchvision=0.14.1
  - pytorch-cuda=11.7
  - numpy=1.23.5
  - scipy=1.9.3
  - pillow=9.4.0
  - tqdm=4.65.0
  - pip
  - pip:
      - opencv-python==4.5.5.64
